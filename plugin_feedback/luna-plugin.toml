name = "plugin-feedback"
shown_name = "Feedback"
version = "0.8.0"
description = "Feedback tickets to the Luna team, with threaded replies — plus silent error capture to the control plane."
entry = "plugin_feedback"
sdk_version = "0"
license = "MIT"
category = "global"
tags = ["feedback", "support", "tickets"]
readme = """
# plugin-feedback

Feedback tickets from any Luna to the Luna team.

- The **agent files feedback**: direct complaints ("this is expensive") get
  offered and drafted; indirect frustration gets filed by the agent itself,
  with the conversation attached as reference. `feedback_ticket_send` is
  `prompt_always` — the approval card is the owner's review box before
  anything leaves the machine.
- The **owner writes feedback** in a Feedback sidebar pane, sees the team's
  answers there, and replies — a threaded conversation.
- When the team answers, the **agent finds out** via a throttled check and a
  one-line prompt note, loads the `feedback-tickets` skill, reads the thread
  and relays it in plain words.

Since 0.2.0 the plugin is also the runtime's **error capture** surface — a
silent side channel, no tickets: a WARNING+ log handler catches agent-side
exceptions, an injected browser reporter catches UI failures (JS errors,
failed loads, failed/slow fetches), and a `report_issue` tool lets the agent
record problems it notices. Everything lands in the control plane's
error_events table (luna-service plan 051) and degrades to a no-op on OSS
installs without a control plane.

All state lives on the luna-service control plane; the plugin is stateless
and authenticates with the machine's gateway token. Credential-shaped strings
are scrubbed from every outbound field.

Source: https://github.com/huemorgan2/plugin-feedback
"""

[requires]
tools = 5

[[tools]]
name = "feedback_ticket_send"
description = "Send a feedback ticket to the Luna team."
policy = "prompt_always"
risk_level = "low"

[[tools]]
name = "feedback_ticket_list"
description = "List this Luna's feedback tickets."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "feedback_ticket_get"
description = "Read one feedback ticket's full thread."
policy = "auto_approve"
risk_level = "low"

[[tools]]
name = "feedback_ticket_reply"
description = "Reply on a feedback ticket thread."
policy = "prompt_always"
risk_level = "low"

[[tools]]
name = "report_issue"
description = "Silently record a technical problem for the Luna team's error tracking."
policy = "auto_approve"
risk_level = "low"
